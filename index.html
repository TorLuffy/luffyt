<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --surface2:#EFEDE7; --ink:#1C1E24; --muted:#6B6E78;
  --line:#E2E0D8; --accent:#B87E14; --accent-soft:#F4E8CF; --accent-ink:#5C3D05;
  --good:#2E7D5B; --good-soft:#DDEFE6; --bad:#C24A42; --bad-soft:#F6E1DF;
  --opt2:#C4372E; --shadow:0 1px 3px rgba(20,22,30,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101319; --surface:#1A1F28; --surface2:#232935; --ink:#ECEDEF; --muted:#8A909C;
    --line:#2A3140; --accent:#F2B33D; --accent-soft:#33290F; --accent-ink:#F8D485;
    --good:#57C28F; --good-soft:#123227; --bad:#E4574F; --bad-soft:#3A1815;
    --opt2:#F0655C; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#101319; --surface:#1A1F28; --surface2:#232935; --ink:#ECEDEF; --muted:#8A909C;
  --line:#2A3140; --accent:#F2B33D; --accent-soft:#33290F; --accent-ink:#F8D485;
  --good:#57C28F; --good-soft:#123227; --bad:#E4574F; --bad-soft:#3A1815;
  --opt2:#F0655C; --shadow:0 1px 3px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#F6F5F1; --surface:#FFFFFF; --surface2:#EFEDE7; --ink:#1C1E24; --muted:#6B6E78;
  --line:#E2E0D8; --accent:#B87E14; --accent-soft:#F4E8CF; --accent-ink:#5C3D05;
  --good:#2E7D5B; --good-soft:#DDEFE6; --bad:#C24A42; --bad-soft:#F6E1DF;
  --opt2:#C4372E; --shadow:0 1px 3px rgba(20,22,30,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:76px;
}
header.app{
  position:sticky; top:0; z-index:30; background:var(--bg);
  padding:14px 16px 10px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
}
.brand{display:flex; align-items:center; gap:9px}
.brand img{width:36px; height:36px; border-radius:9px}
header.app h1{font-size:19px; margin:0; letter-spacing:-.02em}
header.app h1 b{color:var(--accent)}
header.app .sub{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
main{max-width:640px; margin:0 auto; padding:14px 14px 30px}
h2{font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:22px 0 10px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.field{display:flex; flex-direction:column; gap:4px; flex:1; min-width:70px}
.field label{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
input[type=number],input[type=text],input[type=date],textarea,select{
  background:var(--surface2); color:var(--ink); border:1px solid var(--line);
  border-radius:9px; padding:9px 10px; font:inherit; width:100%;
  font-variant-numeric:tabular-nums;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
textarea{resize:vertical; min-height:56px}
.btn{
  background:var(--surface2); color:var(--ink); border:1px solid var(--line);
  border-radius:10px; padding:9px 14px; font:inherit; font-size:14px; cursor:pointer;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#141414; font-weight:600}
.btn.small{padding:5px 10px; font-size:13px; border-radius:8px}
.chip{
  border:1px solid var(--line); background:var(--surface2); color:var(--muted);
  border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer; user-select:none;
}
.chip.on-good{background:var(--good-soft); color:var(--good); border-color:var(--good); font-weight:600}
.chip.on-bad{background:var(--bad-soft); color:var(--bad); border-color:var(--bad); font-weight:600}
.pill{font-size:11px; padding:2px 8px; border-radius:999px; letter-spacing:.04em}
.pill.acc{background:var(--accent-soft); color:var(--accent-ink)}
.pill.good{background:var(--good-soft); color:var(--good)}
.exname{font-weight:650; font-size:15.5px; letter-spacing:-.01em}
.exmeta{font-size:12.5px; color:var(--muted); margin-top:2px}
.exlinks{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.exlinks a{
  font-size:12.5px; color:var(--accent-ink); background:var(--accent-soft);
  text-decoration:none; padding:4px 10px; border-radius:999px;
}
.tiptext{font-size:12.5px; color:var(--muted); font-style:italic; margin-top:6px}
table.series{width:100%; border-collapse:collapse; margin-top:10px; font-variant-numeric:tabular-nums}
table.series th{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); text-align:left; padding:2px 4px; font-weight:600}
table.series td{padding:3px 4px}
table.series td:first-child{font-size:12px; color:var(--muted); white-space:nowrap; width:34px}
table.series input{padding:8px 6px; text-align:center}
.objetivo{margin-top:10px}
.prev{font-size:12px; color:var(--muted); margin-top:6px}
.warm{font-size:13px; color:var(--muted); white-space:pre-line}
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  display:flex; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1; background:none; border:none; color:var(--muted); font:inherit; font-size:10.5px;
  padding:8px 0 9px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
  letter-spacing:.03em;
}
nav.tabs button .ico{font-size:20px; line-height:1}
nav.tabs button.on{color:var(--accent); font-weight:700}
.mealgroup{margin-top:10px}
.mealgroup .glabel{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:4px}
.optline{font-size:13.5px; padding:7px 10px; border-radius:9px; background:var(--surface2); margin-bottom:5px; border-left:3px solid var(--ink)}
.optline.o2{border-left-color:var(--opt2); color:var(--opt2)}
.optline.free{border-left-color:var(--good)}
.note{font-size:12.5px; color:var(--muted)}
.excel-grid{overflow-x:auto}
table.xl{border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; min-width:280px}
table.xl th,table.xl td{border:1px solid var(--line); padding:5px 8px; text-align:center; white-space:nowrap}
table.xl th{background:var(--surface2); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
table.xl td.lbl{text-align:left; color:var(--muted); font-size:12px}
.macros{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center}
.macros .m{background:var(--surface2); border-radius:10px; padding:8px 4px}
.macros .m b{display:block; font-size:17px; font-variant-numeric:tabular-nums}
.macros .m span{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.daynav{display:flex; gap:6px; margin-bottom:12px}
.daynav .chip{flex:1; text-align:center}
.daynav .chip.sel{background:var(--accent); color:#141414; border-color:var(--accent); font-weight:700}
.libitem{border-top:1px solid var(--line); padding:10px 0}
.libitem:first-child{border-top:none; padding-top:0}
.copybox{font-size:12px; color:var(--muted); margin-top:6px}
.toast{
  position:fixed; bottom:86px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:9px 18px; border-radius:999px;
  font-size:13.5px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:60;
}
.toast.show{opacity:1}
.pesobadge{font-size:12px; margin-left:6px}
.hidden{display:none}
.optline{cursor:pointer}
.optline.picked{outline:2px solid var(--accent); outline-offset:-2px}
.alertbar{border-radius:12px; padding:12px 14px; margin-bottom:12px; font-size:13.5px; line-height:1.4}
.alertbar.warn{background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad)}
.alertbar.ok{background:var(--good-soft); color:var(--good); border:1px solid var(--good)}
.alertbar b{color:inherit}
.cafbar{position:relative; height:11px; border-radius:999px; background:var(--surface2);
  border:1px solid var(--line); margin-top:10px; overflow:hidden}
.caffill{height:100%; border-radius:999px; transition:width .3s ease}
.caftick{position:absolute; top:0; bottom:0; width:1px; background:var(--line)}
.cafscale{display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); margin-top:4px}
@media (prefers-reduced-motion: reduce){ .caffill{transition:none} }
.repgoal{font-size:11px; color:var(--accent-ink); background:var(--accent-soft); padding:1px 5px; border-radius:6px; font-weight:600}
.coachhist{margin-top:6px; font-size:12.5px}
.coachhist>a{color:var(--accent-ink); text-decoration:none}
.coachhist-list{margin-top:6px; display:flex; flex-direction:column; gap:5px}
.coachhist-item{background:var(--surface2); border-radius:8px; padding:6px 9px; font-size:12.5px; color:var(--muted)}
.coachhist-item .pill{background:var(--accent-soft); color:var(--accent-ink); margin-right:6px}
.vidrow{display:flex; align-items:center; gap:8px; margin-bottom:7px; flex-wrap:wrap}
.vidrow a{font-size:12.5px; color:var(--accent-ink); background:var(--accent-soft);
  text-decoration:none; padding:5px 11px; border-radius:999px; white-space:nowrap}
.vidrow input.vidnote{flex:1; min-width:130px; font-size:12.5px; padding:6px 9px}
.chip.food{font-size:12.5px; padding:6px 11px; color:var(--ink)}
.chip.food.red{color:var(--opt2); border-color:var(--opt2)}
.chip.food.picked{background:var(--good-soft); color:var(--good); border-color:var(--good); font-weight:600}
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center}
.calhd{font-size:10px; color:var(--muted); text-transform:uppercase; padding:2px 0}
.calday{padding:6px 0 3px; border-radius:8px; font-size:13px; cursor:pointer; border:1px solid transparent; min-height:34px; font-variant-numeric:tabular-nums}
.calday.today{border-color:var(--accent); font-weight:700}
.calday.sel{background:var(--accent-soft)}
.calday .dots{line-height:0; margin-top:1px}
.dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin:0 1px}
.dot.w{background:var(--accent)} .dot.p{background:var(--good)} .dot.c{background:var(--opt2)}
details.card summary{cursor:pointer; font-weight:600}
.filterchips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

}

}
/* Si la directriz son solo números separados por guiones (ej "10-12", "8-7-"),
   son las reps objetivo por serie: [10,12] / [8,7]. Si no, devuelve null. */
function parseSeriesTargets(text){
  if(!text) return null;
  const t=String(text).replace(/\s/g,'').replace(/–/g,'-');
  if(!/^\d+(?:-\d*)*$/.test(t)) return null;   // solo dígitos y guiones
  const parts=t.split('-').filter(x=>x!=='');
  return parts.length>=2 ? parts.map(Number) : null;
}
/* Saca de la directriz el peso objetivo y las reps por serie, para prerrellenar.
   Ej: "55kg a 6" -> {carga:'55', reps:[6]} · "50kg 8-7-" -> {carga:'50', reps:[8,7]}
       "15-13" -> {carga:null, reps:[15,13]} · "sube peso y a 10" -> {carga:null, reps:[10]} */
function parseTarget(text){
  if(text==null||text==='') return null;
  const t=String(text).replace(/–/g,'-');
  let carga=null;
  const kg=t.match(/(\d+(?:[.,]\d+)?)\s*kg/i);
  if(kg) carga=kg[1].replace(',','.');
  const rest=t.replace(/(\d+(?:[.,]\d+)?)\s*kg/ig,' ').replace(/\([^)]*\)/g,' ');
  let reps=null;
  const seq=rest.replace(/\s/g,'').match(/\d+(?:-\d*)+/);   // 8-7- / 15-13
  if(seq){ const p=seq[0].split('-').filter(x=>x!==''); if(p.length) reps=p.map(Number); }
  if(!reps){ const a=rest.match(/a\s*(\d+)/i); if(a) reps=[+a[1]]; }   // "a 10"
  if(carga==null && !reps) return null;
  return {carga, reps};
}
/* reps objetivo para la serie i (si el array tiene 1, es uniforme para todas) */

/* ---- Almacenamiento del dispositivo ---- */
const LS_QUOTA = 5*1024*1024;   // ~5 MB, límite típico de localStorage por navegador
const LS_WARN  = 0.65;          // avisar cuando quede un 35% (65% usado)
function storageInfo(){
  let bytes;
  try{ bytes=new Blob([localStorage.getItem(KEY)||'']).size; }
  catch(e){ bytes=(localStorage.getItem(KEY)||'').length; }
  const pct=bytes/LS_QUOTA;
  const nDays=Object.keys(S.days||{}).length||1;
  const perDay=bytes/nDays;
  const diasRestantes=Math.max(0,Math.floor((LS_QUOTA-bytes)/Math.max(perDay,1)));
  return {bytes, pct, diasRestantes};
}
function fmtSize(b){ return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'; }
function backedUpToday(){ return S.backup && S.backup.lastExport===todayStr(); }

/* Aviso persistente cuando el almacenamiento va lleno (se muestra cada día hasta guardar copia) */
function storageBanner(){
  const info=storageInfo();
  if(info.pct < LS_WARN) return '';
  const pctTxt=Math.round(info.pct*100);
  if(!backedUpToday()){
    return `<div class="alertbar warn">
      ⚠️ <b>Almacenamiento al ${pctTxt}%.</b> Guarda una copia de tus datos hoy para no perder nada.
      <button class="btn small" style="margin-top:6px" onclick="exportJSON()">⬇️ Guardar copia ahora</button>
    </div>`;
  }
  return `<div class="alertbar ok">
    ✅ <b>Copia guardada hoy.</b> Estás al ${pctTxt}%. Si quieres liberar espacio, puedes borrar del móvil los datos ya guardados (tu copia los conserva).
    <button class="btn small ${S.ui.armDel?'':''}" style="margin-top:6px" onclick="askDelete()">🗑️ ${S.ui.armDel?'Confirmar borrado':'Liberar espacio'}</button>
    ${S.ui.armDel?`<button class="btn small" style="margin-top:6px;margin-left:6px" onclick="S.ui.armDel=false;save();render()">Cancelar</button>`:''}
  </div>`;
}
function askDelete(){
  if(!S.ui.armDel){ S.ui.armDel=true; save(); render(); return; }

/* ---- Secuencia de entrenamientos: avanza solo cuando entrenas de verdad ----
   Los días 1-2-3-4 se van consumiendo en orden según las sesiones que registres.
   Un día sin entrenar no cuenta: la siguiente vez que entrenes, tocará el día siguiente. */
function sessionHasData(w){
  return !!w && Object.values(w.ex||{}).some(e=>
    (e.series||[]).some(s=>s&&(s.c||s.r||s.rir)) || e.res || e.obs);
}
function sessionKey(m,d){ return 'm'+m+'-d'+d; }
function nextAfter(m,d){ let nd=d+1, nm=m; if(nd>4){nd=1; nm=m+1;} if(nm>N_MICROS){nm=N_MICROS; nd=4;} return {micro:nm, dia:nd}; }
/* Sesión que toca: la SIGUIENTE al último día que entrenaste de verdad.
   Si el último se registró hoy, seguimos en él. Si NO has registrado nada aún,
   devuelve null → se respeta el microciclo/día que tengas seleccionado. */
function currentSession(){
  const today = todayStr();
  const done = [];
  for(const [k,w] of Object.entries(S.work)){
    const mt=k.match(/m(\d+)-d(\d+)/);
    if(mt && sessionHasData(w)) done.push({micro:+mt[1], dia:+mt[2], fecha:w.fecha||''});
  }
  if(!done.length) return null;
  done.sort((a,b)=> a.micro-b.micro || a.dia-b.dia);  // el más avanzado
  const last = done[done.length-1];
  if(last.fecha===today) return {micro:last.micro, dia:last.dia};  // hoy sigues en él
  return nextAfter(last.micro, last.dia);
}

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekOf(dateStr){
  const ms = new Date(dateStr+'T12:00') - new Date(PLAN_START+'T12:00');
  return Math.floor(ms/86400000/7)+1;
}
function dowName(dateStr){
  return ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][new Date(dateStr+'T12:00').getDay()];
}
function weekDates(week){ // lunes..domingo de la semana N del plan
  const start = new Date(PLAN_START+'T12:00'); start.setDate(start.getDate()+(week-1)*7);
  return Array.from({length:7},(_,i)=>{ const d=new Date(start); d.setDate(d.getDate()+i);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); });
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }

/* Histórico de peso, pasos, cardio y cafeína — últimos días con datos */
function viewHistHoy(){
  const rows=Object.keys(S.days).sort((a,b)=>b.localeCompare(a)).map(f=>{
    const d=S.days[f]||{}, c=d.cardio||{};
    const caf=d.caf?CAFES.reduce((a,x)=>a+(d.caf[x.id]||0)*x.mg,0)+(parseInt(d.caf.otros)||0):0;
    const cardio=(c.tiempo||c.vel||c.incl||c.kcal)
      ? `${c.tiempo?c.tiempo+"'":''}${c.vel?' · '+fmtNum(c.vel):''}${c.incl?' · '+fmtNum(c.incl)+'%':''}${c.kcal?' · '+c.kcal+' kcal':''}`.replace(/^ · /,'')
      : '';
    return {f, peso:d.peso, pasos:d.pasos, cardio, caf};
  }).filter(x=>x.peso||x.pasos||x.cardio||x.caf);

  if(!rows.length) return `
    <h2>📊 Histórico</h2>
    <div class="card"><div class="note">Aún no hay días registrados. Lo que apuntes arriba irá apareciendo aquí.</div></div>`;

  const shown = S.ui.histAll ? rows : rows.slice(0,14);
  return `
  <h2>📊 Histórico</h2>
  <div class="card excel-grid">
    <table class="xl">
      <tr><th style="text-align:left">Día</th><th>⚖️ Peso</th><th>👟 Pasos</th><th>🚴 Cardio</th><th>☕ mg</th></tr>
      ${shown.map(x=>{
        const s=cafStatus(x.caf);
        return `<tr>
          <td class="lbl">${dowName(x.f).slice(0,3)} <span class="note">${x.f.slice(5)}</span></td>
          <td>${x.peso?fmtNum(x.peso):''}</td>
          <td>${x.pasos||''}</td>
          <td style="text-align:left;white-space:nowrap">${esc(x.cardio)}</td>
          <td>${x.caf?`<span style="color:${s.c};font-weight:600">${x.caf}</span>`:''}</td>
        </tr>`;
      }).join('')}
    </table>
    ${rows.length>14?`<button class="btn small" style="margin-top:8px" onclick="toggleHistAll()">${S.ui.histAll?'Ver solo últimos 14 días':'Ver todo el histórico ('+rows.length+' días)'}</button>`:''}
    <div class="note" style="margin-top:8px">Puedes tocar cualquier día arriba (campo Fecha) para ver o editar sus datos.</div>
  </div>`;
}
function toggleHistAll(){ S.ui.histAll=!S.ui.histAll; save(); render(); }

/* ================= ENTRENO ================= */
function wkey(){ return 'm'+S.ui.micro+'-d'+S.ui.dia; }
function wrec(){ const k=wkey(); S.work[k]=S.work[k]||{ex:{}}; return S.work[k]; }
function exrec(id){ const w=wrec(); w.ex[id]=w.ex[id]||{series:[]}; return w.ex[id]; }
function setMicro(v){ S.ui.micro=parseInt(v); save(); render(); }
function setDia(v){ S.ui.dia=v; save(); render(); }
function setWFecha(v){ wrec().fecha=v; save(); }
/* Al registrar lo primero de la sesión, sella la fecha del día en que se entrenó */
function stampFecha(){
  const w=wrec();
  if(!w.fecha){
    w.fecha=todayStr();
    const inp=document.getElementById('wFecha');   // refresca sin re-render (no perder el scroll)
    if(inp) inp.value=w.fecha;
  }
}
function setObj(id,v){ exrec(id).obj=v; save(); }
function setObs(id,v){ stampFecha(); exrec(id).obs=v; save(); }
function setSerie(id,i,f,v){ stampFecha(); const e=exrec(id); e.series[i]=e.series[i]||{}; e.series[i][f]=v; save(); }
/* Guarda toda la fila leyendo sus 3 casillas (carga, reps, rir) del DOM.
   Así, al tocar cualquiera (p.ej. el RIR), se guardan también el peso/reps prerrellenados. */
function setSerieRow(id,i,inp){
  stampFecha();
  const tr=inp.closest('tr'); if(!tr) return;
  const ins=tr.querySelectorAll('input');
  const e=exrec(id); e.series[i]=e.series[i]||{};
  e.series[i].c=ins[0].value; e.series[i].r=ins[1].value; e.series[i].rir=ins[2].value;
  save();
}
function setRes(id,v){ stampFecha(); const e=exrec(id); e.res=(e.res===v?null:v); save(); render(); }
function toggleHist(exId){ S.ui.histOpen = (S.ui.histOpen===exId?null:exId); save(); render(); }
/* Doble toque en una casilla de serie: copia el valor de la serie anterior (o del microciclo previo si es la 1ª) */
function copyPrev(exId,i,field,inp){
  const w=S.work[wkey()], e=w&&w.ex[exId];
  let val='';
  if(i>0){ val=(e&&e.series[i-1]||{})[field] ?? ''; }
  else{
    const pw=S.work['m'+(S.ui.micro-1)+'-d'+S.ui.dia];
    if(pw&&pw.ex[exId]) val=(pw.ex[exId].series[0]||{})[field] ?? '';
  }
  if(val===''||val==null){ toast('No hay valor anterior que copiar'); return; }
  inp.value=val;
  setSerie(exId,i,field,val);
  toast('Copiado de la serie anterior ✅');
}

/* ================= COMIDAS ================= */
function mealRec(f){ S.meals[f]=S.meals[f]||{}; return S.meals[f]; }
function mealSt(id){ const m=mealRec(S.ui.fecha); m[id]=m[id]||{}; return m[id]; }
function setMealDone(id){ const st=mealSt(id); st.done=!st.done; st.doneManual=true; save(); render(); }
function setMealNote(id,v){ const st=mealSt(id); st.note=v; st.manual=true; save(); }

/* Cantidad legible: enteros limpios, fracciones bonitas para unidades sueltas */
function fmtQty(n){
  if(Math.abs(n-Math.round(n))<0.01) return String(Math.round(n));
  const whole=Math.floor(n), frac=+(n-whole).toFixed(2);
  const nice={0.5:'½',0.25:'¼',0.75:'¾',0.33:'⅓',0.67:'⅔'};
  if(nice[frac]) return (whole?whole:'')+nice[frac];
  return String(+n.toFixed(1)).replace('.',',');
}
/* Si eliges n alimentos del mismo grupo, cada uno cuenta 1/n de ración */
function scaleFood(t,n){
  if(n<=1) return t;
  const m=t.match(/^([\d.,]+)\s+(.*)$/);
  if(!m) return t;                                   // ej: "Verduras al gusto"
  const q=parseFloat(m[1].replace(',','.'))/n;
  let rest=m[2];
  if(/^(g|ml)\b/.test(rest))                         // peso: 1 decimal
    return String(Math.round(q*10)/10).replace('.',',')+' '+rest;
  if(Math.abs(q-1)<0.01) rest=rest.replace(/^(\S+?)s\b/,'$1');   // "2 kiwis"→"1 kiwi"
  return fmtQty(q)+' '+rest;
}
function composeMealNote(id,st){
  const meal=mealById(id); if(!meal) return '';
  const parts=[];
  meal.groups.forEach((g,gi)=>{
    const sel=g.foods.map((fd,fi)=>({fd,fi})).filter(x=>(st.pick||{})[gi+'-'+x.fi]);
    sel.forEach(x=>parts.push(scaleFood(x.fd.t, sel.length)));
  });
  return parts.join(' + ');
}
/* Cumplida = hay algo elegido en todos los grupos obligatorios (verduras no cuenta) */
function mealComplete(meal,st){
  if(!meal||!meal.groups) return false;
  const req=meal.groups.map((g,gi)=>({g,gi})).filter(x=>!x.g.opt);
  return req.length>0 && req.every(x=>x.g.foods.some((fd,fi)=>(st.pick||{})[x.gi+'-'+fi]));
}
function toggleFood(id,gi,fi){
  const st=mealSt(id);
  st.pick=st.pick||{};
  const k=gi+'-'+fi;
  if(st.pick[k]) delete st.pick[k]; else st.pick[k]=true;
  if(!st.manual) st.note=composeMealNote(id,st);
  delete st.doneManual;                              // al cambiar la selección, vuelve a evaluarse solo
  st.done=mealComplete(mealById(id),st);
  save(); render();
}

  const f=S.ui.fecha, mm=S.meals[f]||{};
  let html=`
  <div class="card">
    <div class="row">
      <div class="field"><label>Fecha</label><input type="date" value="${f}" onchange="setFecha(this.value)"></div>
    </div>
    <div class="macros" style="margin-top:10px">
      <div class="m"><b>${MACROS.kcal}</b><span>kcal</span></div>
      <div class="m"><b>${MACROS.p}</b><span>Proteína</span></div>
      <div class="m"><b>${MACROS.h}</b><span>Hidratos</span></div>
      <div class="m"><b>${MACROS.g}</b><span>Grasas</span></div>
    </div>
    <div class="note" style="margin-top:10px">${NUTRI_NOTES}</div>
    <div class="note" style="margin-top:6px">Toca los alimentos que comas. Cada uno = 1 ración de ese macro; si eliges <b>varios del mismo grupo</b>, las cantidades se reparten solas (ej: 10 g aceite + 10 g nueces → 5 g y 5 g). En negro <b>opción 1</b>, en <span style="color:var(--opt2);font-weight:600">rojo opción 2</span>, y puedes mezclar. La comida se marca <b>✅ Cumplida</b> sola cuando cubres todos sus grupos (las verduras son opcionales) — y siempre puedes marcarla o desmarcarla tú.</div>
  </div>`;
  for(const meal of allMeals()) html+=renderMealCard(meal, mm[meal.id]||{});
  return html;
}

function renderMealCard(meal, st){
  const onLbl=meal.doneOn||'✅ Cumplida', offLbl=meal.doneOff||'Marcar';
  return `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="exname">${meal.n}</div>
        <span class="chip ${st.done?'on-good':''}" onclick="setMealDone('${meal.id}')">${st.done?onLbl:offLbl}</span>
      </div>
      ${meal.hint?`<div class="note" style="margin-top:4px">${esc(meal.hint)}</div>`:''}
      ${meal.groups.map((g,gi)=>`
        <div class="mealgroup">
          <div class="glabel">${g.g}${g.opt?' <span style="text-transform:none;letter-spacing:0">(opcional)</span>':''}</div>
          <div class="filterchips">
          ${g.foods.map((fd,fi)=>{
            const on=(st.pick||{})[gi+'-'+fi];
            return `<span class="chip food ${fd.c==='r'?'red':''} ${on?'picked':''}" onclick="toggleFood('${meal.id}',${gi},${fi})">${esc(fd.t)}</span>`;
          }).join('')}
          </div>
        </div>`).join('')}
      ${meal.note?`<div class="note" style="margin-top:8px;white-space:pre-line">${esc(meal.note)}</div>`:''}
      <div class="field" style="margin-top:8px"><label>Qué comí (se rellena solo · editable)</label>
        <input type="text" placeholder="Ej: 1 huevo + 10 g proteína + 40 g pan…" value="${esc(st.note??'')}" onchange="setMealNote('${meal.id}',this.value)"></div>
    </div>`;
}

/* ================= BIBLIOTECA DE VÍDEOS ================= */
let libFilter='', vidMuscles=[], vidOrder='az';
function setLibFilter(v){ libFilter=v.toLowerCase(); render(); }
function setVidOrder(v){ vidOrder=v; render(); }
function toggleArr(arr,v){ const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); }
function setVidMuscle(v){ toggleArr(vidMuscles,v); render(); }
function addLibVideo(){
  const name=document.getElementById('libName').value.trim();
  const url=document.getElementById('libUrl').value.trim();
  const nota=document.getElementById('libNota').value.trim();
  if(!name||!url){ toast('Pon ejercicio y enlace'); return; }
  S.lib[name]=S.lib[name]||[];
  S.lib[name].push({url,nota,fecha:todayStr()});
  save(); render(); toast('Vídeo guardado 🎬');
}
function delLibVideo(name,i){ S.lib[name].splice(i,1); if(!S.lib[name].length) delete S.lib[name]; save(); render(); }
function setVidNote(url,v){ if(v.trim()) S.vidNotes[url]=v.trim(); else delete S.vidNotes[url]; save(); }
function setCoachNote(name,i,v){ S.lib[name][i].nota=v; save(); }
/* fila de vídeo con enlace + nota editable */
function vidRow(url,label,note,onchange){
  return `<div class="vidrow">
    <a href="${esc(url)}" target="_blank" rel="noopener">${label}</a>
    <input type="text" class="vidnote" placeholder="Añadir nota…" value="${esc(note||'')}" onchange="${onchange}">
  </div>`;
}

function viewVideos(){
  const allNames=[...new Set([].concat(...[1,2,3,4].map(d=>DAYS[d].items.map(e=>e.n))))].sort((a,b)=>a.localeCompare(b));
  const catalog=[];
  for(const n of allNames){
    const planVids=[];
    for(const d of [1,2,3,4]) for(const e of DAYS[d].items) if(e.n===n){
      if(e.v&&!planVids.some(p=>p.url===e.v)) planVids.push({url:e.v,src:'plan'});
      if(e.tv&&!planVids.some(p=>p.url===e.tv)) planVids.push({url:e.tv,src:'tip'});
      if(e.t&&!planVids.some(p=>p.t===e.t)) planVids.push({t:e.t,src:'tip'});
    }
    catalog.push({n, plan:planVids, coach:S.lib[n]||[]});
  }
  for(const n of Object.keys(S.lib)) if(!allNames.includes(n)) catalog.push({n, plan:[], coach:S.lib[n]});
  for(const c of catalog) c.muscle=muscleOf(c.n);
  let items=catalog.filter(c=>(!libFilter||c.n.toLowerCase().includes(libFilter)) && (!vidMuscles.length||vidMuscles.some(m=>c.muscle.includes(m))));
  if(vidOrder==='az') items.sort((a,b)=>a.n.localeCompare(b.n));
  else if(vidOrder==='recientes') items.sort((a,b)=>{
    const fa=a.coach.length?Math.max(...a.coach.map(v=>v.fecha||'')):'', fb=b.coach.length?Math.max(...b.coach.map(v=>v.fecha||'')):'';
    return fb<fa?-1:fb>fa?1:a.n.localeCompare(b.n);
  });
  else if(vidOrder==='musculo') items.sort((a,b)=>(a.muscle||'~').localeCompare(b.muscle||'~')||a.n.localeCompare(b.n));

  let html=`
  <div class="card">
    <div class="exname">📖 Vídeos genéricos del plan</div>
    <div style="margin-top:8px">
      ${GENERIC_VIDEOS.map(v=>vidRow(v.u, '🎬 '+esc(v.t), S.vidNotes[v.u], `setVidNote('${v.u}',this.value)`)).join('')}
    </div>
  </div>`;
  html+=`
  <div class="card">
    <div class="field"><label>Añadir vídeo del coach (correcciones que te envíe)</label>
      <input type="text" id="libName" list="exnames" placeholder="Ejercicio (ej: Sentadilla Libre)">
      <datalist id="exnames">${allNames.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <input type="text" id="libUrl" placeholder="Enlace (Instagram, YouTube…)" style="margin-top:6px">
      <input type="text" id="libNota" placeholder="Observaciones (ej: profundidad, rodillas…)" style="margin-top:6px">
    </div>
    <button class="btn primary" style="margin-top:8px;width:100%" onclick="addLibVideo()">Guardar vídeo</button>
  </div>
  <div class="card">
    <input type="text" placeholder="🔍 Buscar ejercicio…" value="${esc(libFilter)}" oninput="setLibFilter(this.value)">
    <div class="row" style="margin-top:8px">
      <div class="field"><label>Ordenar</label>
        <select onchange="setVidOrder(this.value)">
          <option value="az" ${vidOrder==='az'?'selected':''}>Alfabético (A-Z)</option>
          <option value="recientes" ${vidOrder==='recientes'?'selected':''}>Recientes (últimos añadidos)</option>
          <option value="musculo" ${vidOrder==='musculo'?'selected':''}>Por grupo muscular</option>
        </select></div>
    </div>
    <div class="filterchips">
      ${MUSCLES.map(m=>`<span class="chip ${vidMuscles.includes(m)?'on-good':''}" onclick="setVidMuscle('${m}')">${m}</span>`).join('')}
    </div>
  </div>
  <div class="card">`;
  for(const c of items){
    if(!c.plan.length&&!c.coach.length&&libFilter==='') continue;
    html+=`<div class="libitem">
      <div class="exname">${esc(c.n)} ${c.muscle?`<span class="pill acc">${c.muscle}</span>`:''}</div>
      ${c.plan.filter(p=>p.url).map(p=>vidRow(p.url, (p.src==='tip'?'💡 TIP':'🎬 Técnica')+' (plan)', S.vidNotes[p.url], `setVidNote('${p.url}',this.value)`)).join('')}
      ${c.coach.map((v,i)=>vidRow(v.url, '📩 Corrección '+(i+1)+(v.fecha?' · '+v.fecha:''), v.nota, `setCoachNote('${esc(c.n).replace(/'/g,"\\'")}',${i},this.value)`)
        +`<div class="tiptext" style="margin:-4px 0 8px"><a href="#" style="color:var(--bad)" onclick="delLibVideo('${esc(c.n).replace(/'/g,"\\'")}',${i});return false">borrar corrección ${i+1}</a></div>`).join('')}
      ${c.plan.filter(p=>p.t).map(p=>`<div class="tiptext">💡 ${esc(p.t)}</div>`).join('')}
    </div>`;
  }
  html+=`</div>`;
  return html;
}

/* ================= DIARIO: calendario + historial ================= */
let histMuscles=[], histQ='', foodTags=[], foodQ='';
function setHistMuscle(v){ toggleArr(histMuscles,v); render(); }
function setHistQ(v){ histQ=v.toLowerCase(); render(); }
function setFoodTag(v){ toggleArr(foodTags,v); render(); }
function setFoodQ(v){ foodQ=v.toLowerCase(); render(); }
function mealMatches(mm, tagLbls, q){
  // texto de todo lo comido ese día (nombres de comida marcada + notas)
  let txt='';
  for(const x of allMeals()){ const st=mm[x.id]; if(st&&(st.done||st.note)) txt+=' '+x.n+' '+(st.note||'')+' '+(x.desc||''); }
  txt=txt.toLowerCase();
  if(q && !txt.includes(q)) return false;
  if(tagLbls.length){
    const tags=FOOD_TAGS.filter(t=>tagLbls.includes(t.lbl));
    if(!tags.some(t=>t.kw.some(k=>txt.includes(k)))) return false;
  }
  return txt.trim()!=='';
}
function calYM(){ if(!S.ui.calYM) S.ui.calYM=todayStr().slice(0,7); return S.ui.calYM; }
function calMove(n){
  const [y,m]=calYM().split('-').map(Number);
  const d=new Date(y, m-1+n, 1);
  S.ui.calYM=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  save(); render();
}
function calSel(f){ S.ui.calSel=(S.ui.calSel===f?null:f); save(); render(); }
function workoutsByDate(){
  const map={};
  for(const [k,w] of Object.entries(S.work)){
    if(!w.fecha) continue;
    const has=Object.values(w.ex||{}).some(e=>(e.series||[]).some(s=>s&&(s.c||s.r)));
    if(has) (map[w.fecha]=map[w.fecha]||[]).push(k);
  }
  return map;
}

function viewCal(){
  const ym=calYM(), [Y,M]=ym.split('-').map(Number);
  const first=new Date(Y,M-1,1), startDow=(first.getDay()+6)%7, ndays=new Date(Y,M,0).getDate();
  const wmap=workoutsByDate(), today=todayStr();
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div></div>';
  for(let d=1; d<=ndays; d++){
    const f=ym+'-'+String(d).padStart(2,'0');
    const day=S.days[f]||{}, mm=S.meals[f]||{};
    const dots=[];
    if(wmap[f]) dots.push('<span class="dot w"></span>');
    if(day.peso) dots.push('<span class="dot p"></span>');
    if(Object.values(mm).some(x=>x&&x.done)) dots.push('<span class="dot c"></span>');
    cells+=`<div class="calday ${f===today?'today':''} ${S.ui.calSel===f?'sel':''}" onclick="calSel('${f}')">${d}<div class="dots">${dots.join('')}</div></div>`;
  }
  const monthName=first.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  let html=`
  <div class="card">
    <a class="btn primary" style="display:block;text-align:center;text-decoration:none" href="${EXCEL_URL}" target="_blank" rel="noopener">📊 Abrir el Excel del plan (del coach)</a>
    <div class="note" style="margin-top:6px">Para copiar tus datos a mano, celda a celda (ver "Exportar" más abajo).</div>
  </div>
  <div class="card">
    <div class="exname">📤 Enviar el día a mi Excel</div>
    <div class="note" style="margin-top:4px">Copia todo lo de hoy (peso, pasos, cardio y ejercicios) y pégalo en tu Excel personal — una fila por serie.</div>
    <button class="btn primary" style="width:100%;margin-top:10px" id="cp-hoy" data-copy="${esc(buildTodayRows())}" onclick="copyText('cp-hoy')">📋 Copiar todo lo de hoy</button>
    <a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="${MI_EXCEL_URL}" target="_blank" rel="noopener">📗 Abrir mi Excel personal</a>
    <div class="note" style="margin-top:8px">Ábrelo en Hojas de cálculo → toca la primera celda vacía de la columna A → Pegar. Tú eliges cuándo hacerlo.</div>
  </div>
  ${viewStorage()}
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <button class="btn small" onclick="calMove(-1)">◀</button>
      <b style="text-transform:capitalize">${monthName}</b>
      <button class="btn small" onclick="calMove(1)">▶</button>
    </div>
    <div class="calgrid" style="margin-top:8px">
      ${['L','M','X','J','V','S','D'].map(x=>`<div class="calhd">${x}</div>`).join('')}${cells}
    </div>
    <div class="note" style="margin-top:6px"><span class="dot w"></span> entreno · <span class="dot p"></span> peso · <span class="dot c"></span> comidas</div>
  </div>`;

  if(S.ui.calSel){
    const f=S.ui.calSel, d=S.days[f]||{}, c=d.cardio||{}, mm=S.meals[f]||{};
    const bits=[];
    if(d.peso) bits.push('⚖️ '+fmtNum(d.peso)+' kg');
    if(d.pasos) bits.push('👟 '+d.pasos+' pasos');
    if(c.tiempo||c.kcal) bits.push(`🚴 ${c.tiempo||'–'}' · vel ${fmtNum(c.vel)||'–'} · incl ${fmtNum(c.incl)||'–'}${c.kcal?' · '+c.kcal+' kcal':''}`);
    const eaten=allMeals().filter(x=>mm[x.id]&&mm[x.id].done);
    html+=`<h2>📌 ${dowName(f)} · ${f}</h2><div class="card">
      ${bits.length?`<div>${bits.join('<br>')}</div>`:'<div class="note">Sin registro físico este día.</div>'}
      ${eaten.length?`<div style="margin-top:8px">🍽️ ${eaten.map(x=>`<b>${x.n}</b>${mm[x.id].note?' — '+esc(mm[x.id].note):''}`).join('<br>')}</div>`:''}`;
    for(const k of (wmap[f]||[])){
      const mObj=k.match(/m(\d+)-d(\d+)/), mi=mObj[1], di=mObj[2], w=S.work[k];
      html+=`<div style="margin-top:10px"><b>🏋️ Microciclo ${mi} · Día ${di} (${DAYS[di].pat})</b>`;
      for(const ex of DAYS[di].items){
        const e=w.ex[ex.id]; if(!e) continue;
        const ss=(e.series||[]).filter(s=>s&&(s.c||s.r));
        if(ss.length) html+=`<div class="note">${esc(ex.n)}: ${ss.map(s=>`${fmtNum(s.c)||'–'}×${s.r||'–'}${s.rir?' R'+s.rir:''}`).join(' · ')} ${e.res==='llegue'?'✅':e.res==='corto'?'⚠️':''}</div>`;
      }
      html+='</div>';
    }
    html+='</div>';
  }

  // Historial de entrenos con filtros
  html+=`
  <h2>🗂️ Historial de entrenos</h2>
  <div class="card">
    <input type="text" placeholder="🔍 Filtrar por ejercicio…" value="${esc(histQ)}" oninput="setHistQ(this.value)">
    <div class="filterchips">
      ${MUSCLES.map(m=>`<span class="chip ${histMuscles.includes(m)?'on-good':''}" onclick="setHistMuscle('${m}')">${m}</span>`).join('')}
    </div>
  </div>`;
  const sessions=Object.entries(S.work)
    .map(([k,w])=>({k,w,m:parseInt(k.match(/m(\d+)/)[1]),d:parseInt(k.match(/d(\d+)/)[1])}))
    .filter(s=>Object.values(s.w.ex||{}).some(e=>(e.series||[]).some(x=>x&&(x.c||x.r))))
    .sort((a,b)=>(b.w.fecha||'').localeCompare(a.w.fecha||'')||b.m-a.m||b.d-a.d);
  let anyHist=false;
  for(const s of sessions){
    let rows='';
    for(const ex of DAYS[s.d].items){
      const e=s.w.ex[ex.id]; if(!e) continue;
      if(histMuscles.length && !histMuscles.some(m=>(MUSCLE[ex.id]||'').includes(m))) continue;
      if(histQ && !ex.n.toLowerCase().includes(histQ)) continue;
      const ss=(e.series||[]).filter(x=>x&&(x.c||x.r));
      if(!ss.length) continue;
      rows+=`<div class="libitem"><b>${esc(ex.n)}</b> <span class="pill acc">${MUSCLE[ex.id]||''}</span>
        <div class="note">${ss.map(x=>`${fmtNum(x.c)||'–'} kg × ${x.r||'–'}${x.rir?' · RIR '+x.rir:''}`).join('  |  ')} ${e.res==='llegue'?'✅':e.res==='corto'?'⚠️':''}${e.obs?'<br>📝 '+esc(e.obs):''}</div></div>`;
    }
    if(rows){
      anyHist=true;
      html+=`<div class="card"><div class="exmeta" style="margin-bottom:6px"><b>Microciclo ${s.m} · Día ${s.d}</b>${s.w.fecha?' · '+s.w.fecha:''}</div>${rows}</div>`;
    }
  }
  if(!anyHist) html+='<div class="card"><div class="note">Aún no hay entrenos que coincidan con el filtro.</div></div>';

  // Historial de comidas con filtros (¿cuándo comí huevos?)
  html+=`
  <h2>🍽️ Historial de comidas</h2>
  <div class="card">
    <input type="text" placeholder="🔍 Buscar alimento (ej: huevo, salmón…)" value="${esc(foodQ)}" oninput="setFoodQ(this.value)">
    <div class="filterchips">
      ${FOOD_TAGS.map(t=>`<span class="chip ${foodTags.includes(t.lbl)?'on-good':''}" onclick="setFoodTag('${t.lbl.replace(/'/g,"\\'")}')">${t.lbl}</span>`).join('')}
    </div>
  </div>`;
  const mealDays=Object.keys(S.meals).filter(f=>mealMatches(S.meals[f], foodTags, foodQ)).sort((a,b)=>b.localeCompare(a));
  if(mealDays.length){
    for(const f of mealDays){
      const mm=S.meals[f];
      const eaten=allMeals().filter(x=>mm[x.id]&&(mm[x.id].done||mm[x.id].note));
      html+=`<div class="card"><div class="exmeta" style="margin-bottom:6px"><b>${dowName(f)}</b> · ${f}</div>
        ${eaten.map(x=>`<div class="note"><b>${x.n}</b>${mm[x.id].note?' — '+esc(mm[x.id].note):''}</div>`).join('')}</div>`;
    }
  } else {
    html+='<div class="card"><div class="note">'+((foodTags.length||foodQ)?'Ningún día coincide con el filtro.':'Aún no hay comidas registradas.')+'</div></div>';
  }

  html+=`<details class="card"><summary>📤 Exportar al Excel de LuffyFitnessCoach</summary><div style="margin-top:10px">${viewExport()}</div></details>`;
  return html;
}

/* ================= EXCEL (vista espejo + export) ================= */
function setXlMicro(v){ S.ui.xlMicro=parseInt(v); save(); render(); }
function copyText(id){
  const el=document.getElementById(id);
  navigator.clipboard.writeText(el.dataset.copy).then(()=>toast('Copiado 📋'),()=>toast('No se pudo copiar'));
}
function fmtNum(v){ return (v==null||v==='')?'':String(v).replace('.',','); }

/* ---- Periodo a exportar: día, rango, microciclo o todo ---- */
function expSt(){ S.ui.exp=S.ui.exp||{mode:'micro', from:todayStr(), to:todayStr()}; return S.ui.exp; }
function setExpMode(m){ expSt().mode=m; save(); render(); }
function setExpFrom(v){ const e=expSt(); e.from=v; if(e.to<v) e.to=v; save(); render(); }
function setExpTo(v){ expSt().to=v; save(); render(); }
function expRange(){
  const e=expSt();
  if(e.mode==='dia')   return {from:e.from, to:e.from, lbl:'Día '+e.from};
  if(e.mode==='rango') return {from:e.from, to:e.to,   lbl:e.from+' → '+e.to};
  if(e.mode==='micro'){ const wd=weekDates(S.ui.xlMicro);
    return {from:wd[0], to:wd[6], micro:S.ui.xlMicro, lbl:'Microciclo '+S.ui.xlMicro}; }
  return {from:'0000-01-01', to:'9999-12-31', lbl:'Todo el plan'};
}
/* En modo microciclo se filtra por número de sesión; en los demás, por fecha real */
function sessionsIn(r){
  return Object.entries(S.work)
    .map(([k,w])=>({k,w,m:+k.match(/m(\d+)/)[1], d:+k.match(/d(\d+)/)[1]}))
    .filter(s=>sessionHasData(s.w))
    .filter(s=> r.micro ? s.m===r.micro : (s.w.fecha && s.w.fecha>=r.from && s.w.fecha<=r.to))
    .sort((a,b)=>(a.w.fecha||'').localeCompare(b.w.fecha||'')||a.m-b.m||a.d-b.d);
}
function daysIn(r){ return Object.keys(S.days).filter(f=>f>=r.from&&f<=r.to).sort(); }

function viewExport(){
  const e=expSt(), r=expRange(), micro=S.ui.xlMicro;
  const MODES=[['dia','Un día'],['rango','Rango'],['micro','Microciclo'],['todo','Todo']];
  let html=`
  <div class="card">
    <div class="glabel">Qué exportar</div>
    <div class="filterchips">
      ${MODES.map(([k,l])=>`<span class="chip ${e.mode===k?'on-good':''}" onclick="setExpMode('${k}')">${l}</span>`).join('')}
    </div>
    ${e.mode==='dia'?`
      <div class="field" style="margin-top:10px"><label>Fecha</label>
        <input type="date" value="${e.from}" onchange="setExpFrom(this.value)"></div>`:''}
    ${e.mode==='rango'?`
      <div class="row" style="margin-top:10px">
        <div class="field"><label>Desde</label><input type="date" value="${e.from}" onchange="setExpFrom(this.value)"></div>
        <div class="field"><label>Hasta</label><input type="date" value="${e.to}" onchange="setExpTo(this.value)"></div>
      </div>`:''}
    ${e.mode==='micro'?`
      <div class="field" style="margin-top:10px"><label>Microciclo</label>
        <select onchange="setXlMicro(this.value)">${Array.from({length:N_MICROS},(_,i)=>`<option value="${i+1}" ${micro===i+1?'selected':''}>Microciclo ${i+1}</option>`).join('')}</select></div>`:''}
    <div class="note" style="margin-top:10px">Exportando: <b>${esc(r.lbl)}</b>. Los valores salen en el mismo orden que el Excel de LuffyFitnessCoach: por ejercicio, filas de serie con <b>CARGA · Rep. · RIR</b>.</div>
    <button class="btn primary" style="margin-top:10px;width:100%" onclick="exportRangeCSV()">⬇️ Descargar CSV de esta selección</button>
  </div>`;

  // — Entrenos —
  const sess=sessionsIn(r);
  if(sess.length){
    for(const s of sess){
      let rows='', copyLines=[];
      for(const ex of DAYS[s.d].items){
        const ee=s.w.ex[ex.id]||{series:[]};
        for(let i=0;i<ex.s;i++){
          const x=ee.series[i]||{};
          rows+=`<tr><td class="lbl">${i===0?esc(ex.n):''}</td><td>${fmtNum(x.c)}</td><td>${fmtNum(x.r)}</td><td>${fmtNum(x.rir)}</td></tr>`;
          copyLines.push([fmtNum(x.c),fmtNum(x.r),fmtNum(x.rir)].join('\t'));
        }
        if(ee.res||ee.obs) rows+=`<tr><td class="lbl" colspan="4" style="font-size:11px">${ee.res==='llegue'?'✅ llegué':ee.res==='corto'?'⚠️ corto':''}${ee.obs?' — '+esc(ee.obs):''}</td></tr>`;
      }
      html+=`
      <h2>🏋️ Microciclo ${s.m} · Día ${s.d} (${DAYS[s.d].pat})${s.w.fecha?` · ${s.w.fecha}`:''}</h2>
      <div class="card excel-grid">
        <table class="xl"><tr><th style="text-align:left">Ejercicio</th><th>Carga</th><th>Rep.</th><th>RIR</th></tr>${rows}</table>
        <button class="btn small" style="margin-top:8px" id="cp-${s.k}" data-copy="${esc(copyLines.join('\n'))}" onclick="copyText('cp-${s.k}')">📋 Copiar CARGA·Rep·RIR</button>
      </div>`;
    }
  } else {
    html+=`<h2>🏋️ Entrenos</h2><div class="card"><div class="note">Ningún entreno registrado en esta selección.</div></div>`;
  }

  // — Peso —
  if(r.micro){                                        // formato espejo del Excel (lun→dom)
    const wd=weekDates(r.micro), names=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
    const pesos=wd.map(f=>S.days[f]&&S.days[f].peso!=null&&S.days[f].peso!==''?parseFloat(S.days[f].peso):null);
    const valid=pesos.filter(p=>p!=null);
    const media=valid.length?(valid.reduce((a,b)=>a+b,0)/valid.length):null;
    const wdPrev=r.micro>1?weekDates(r.micro-1):null;
    let mediaPrev=null;
    if(wdPrev){ const pv=wdPrev.map(f=>S.days[f]&&S.days[f].peso?parseFloat(S.days[f].peso):null).filter(p=>p!=null);
      if(pv.length) mediaPrev=pv.reduce((a,b)=>a+b,0)/pv.length; }
    const balance=(media!=null&&mediaPrev!=null)?(media-mediaPrev):null;
    html+=`
    <h2>⚖️ Peso corporal · semana ${r.micro}</h2>
    <div class="card excel-grid">
      <table class="xl">
        ${names.map((n,i)=>`<tr><td class="lbl">${n} <span class="note">${wd[i].slice(5)}</span></td><td>${pesos[i]!=null?fmtNum(pesos[i]):''}</td></tr>`).join('')}
        <tr><td class="lbl"><b>Media semanal</b></td><td><b>${media!=null?fmtNum(media.toFixed(2)):''}</b></td></tr>
        ${balance!=null?`<tr><td class="lbl">Balance vs sem. ${r.micro-1}</td><td>${balance>0?'+':''}${fmtNum(balance.toFixed(2))}</td></tr>`:''}
      </table>
      <button class="btn small" style="margin-top:8px" id="cp-peso" data-copy="${esc(pesos.map(p=>p==null?'':fmtNum(p)).join('\n'))}" onclick="copyText('cp-peso')">📋 Copiar columna de pesos (lun→dom)</button>
    </div>`;
  } else {
    const fs=daysIn(r).filter(f=>S.days[f].peso!=null&&S.days[f].peso!=='');
    const vals=fs.map(f=>parseFloat(S.days[f].peso));
    const media=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):null;
    html+=`
    <h2>⚖️ Peso corporal</h2>
    <div class="card excel-grid">
      ${fs.length?`<table class="xl">
        ${fs.map(f=>`<tr><td class="lbl">${dowName(f)} <span class="note">${f}</span></td><td>${fmtNum(S.days[f].peso)}</td></tr>`).join('')}
        <tr><td class="lbl"><b>Media del periodo</b></td><td><b>${fmtNum(media.toFixed(2))}</b></td></tr>
      </table>
      <button class="btn small" style="margin-top:8px" id="cp-peso" data-copy="${esc(fs.map(f=>fmtNum(S.days[f].peso)).join('\n'))}" onclick="copyText('cp-peso')">📋 Copiar columna de pesos</button>`
      :'<div class="note">Sin pesajes en esta selección.</div>'}
    </div>`;
  }

  // — Cardio, pasos y cafeína —
  const fs=daysIn(r);
  let cardioRows='', pasosVals=[];
  for(const f of fs){
    const d=S.days[f]||{}, c=d.cardio||{};
    if(d.pasos) pasosVals.push(parseInt(d.pasos));
    const caf=d.caf?CAFES.reduce((a,x)=>a+(d.caf[x.id]||0)*x.mg,0)+(parseInt(d.caf.otros)||0):0;
    if(d.pasos||c.tiempo||c.kcal||caf)
      cardioRows+=`<tr><td class="lbl">${dowName(f).slice(0,3)} ${f.slice(5)}</td><td>${fmtNum(c.tiempo)}</td><td>${fmtNum(c.vel)}</td><td>${fmtNum(c.incl)}</td><td>${fmtNum(c.kcal)}</td><td>${fmtNum(d.pasos)}</td><td>${caf||''}</td></tr>`;
  }
  const mediaPasos=pasosVals.length?Math.round(pasosVals.reduce((a,b)=>a+b,0)/pasosVals.length):null;
  html+=`
  <h2>🚴 Cardio, pasos y cafeína</h2>
  <div class="card excel-grid">
    ${cardioRows?`<table class="xl"><tr><th></th><th>Tiempo</th><th>Vel.</th><th>Incl.</th><th>Kcal</th><th>Pasos</th><th>mg caf.</th></tr>${cardioRows}
      ${mediaPasos?`<tr><td class="lbl"><b>Media pasos</b></td><td colspan="4"></td><td><b>${mediaPasos}</b></td><td></td></tr>`:''}</table>`
      :'<div class="note">Sin datos de cardio en esta selección.</div>'}
  </div>`;

  // — Comidas —
  const mealDays=Object.keys(S.meals).filter(f=>f>=r.from&&f<=r.to).sort();
  let mealRows='';
  for(const f of mealDays){
    const mm=S.meals[f];
    const eaten=allMeals().filter(x=>mm[x.id]&&(mm[x.id].done||mm[x.id].note));
    if(eaten.length) mealRows+=`<div class="libitem"><b>${dowName(f)} ${f}</b>
      ${eaten.map(x=>`<div class="note">${x.n}${mm[x.id].note?' — '+esc(mm[x.id].note):''}${mm[x.id].done?' ✅':''}</div>`).join('')}</div>`;
  }
  html+=`
  <h2>🍽️ Comidas</h2>
  <div class="card">${mealRows||'<div class="note">Sin comidas registradas en esta selección.</div>'}</div>`;

  // — Backup —
  html+=`
  <h2>💾 Copia de seguridad</h2>
  <div class="card">
    <div class="row">
      <button class="btn" onclick="exportJSON()">⬇️ Exportar todo (JSON)</button>
      <button class="btn" onclick="document.getElementById('impFile').click()">⬆️ Importar</button>
      <input type="file" id="impFile" accept=".json" class="hidden" onchange="importJSON(this)">
      <button class="btn" onclick="exportCSV()">⬇️ CSV completo</button>
    </div>
    <div class="note" style="margin-top:8px">Tus datos viven solo en este dispositivo. Exporta de vez en cuando por seguridad.</div>
  </div>`;
  return html;
}

function download(name, content, type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function exportJSON(){
  download('luffyt-backup-'+todayStr()+'.json', JSON.stringify(S,null,1),'application/json');
  S.backup=S.backup||{}; S.backup.lastExport=todayStr(); save();
  toast('Copia descargada ✅'); render();
}
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result); if(!d.days&&!d.work) throw 0;
    // COMBINA (no reemplaza): lo importado rellena huecos; lo que ya tienes manda si coincide
    S.days    =Object.assign({}, d.days||{},     S.days||{});
    S.work    =Object.assign({}, d.work||{},     S.work||{});
    S.meals   =Object.assign({}, d.meals||{},    S.meals||{});
    S.lib     =Object.assign({}, d.lib||{},      S.lib||{});
    S.vidNotes=Object.assign({}, d.vidNotes||{}, S.vidNotes||{});
    const cs=currentSession(); if(cs){ S.ui.micro=cs.micro; S.ui.dia=cs.dia; S.ui.xlMicro=cs.micro; }
    save(); render(); toast('Datos importados ✅');
  }catch(e){ toast('Archivo no válido'); } };
  r.readAsText(f);
}
function exportCSV(){
  let lines=['tipo;fecha/clave;campo;valor'];
  for(const [f,d] of Object.entries(S.days)){
    if(d.peso) lines.push(`peso;${f};kg;${d.peso}`);
    if(d.pasos) lines.push(`pasos;${f};pasos;${d.pasos}`);
    const c=d.cardio||{};
    for(const k of ['tiempo','vel','incl','kcal']) if(c[k]) lines.push(`cardio;${f};${k};${c[k]}`);
    if(d.caf){
      const tot=CAFES.reduce((a,x)=>a+(d.caf[x.id]||0)*x.mg,0)+(parseInt(d.caf.otros)||0);
      const det=CAFES.filter(x=>d.caf[x.id]).map(x=>`${x.n}x${d.caf[x.id]}`).join(' ');
      if(tot) lines.push(`cafeina;${f};mg;${tot}${det?' ("'+det+'")':''}`);
    }
    if(d.notas) lines.push(`nota;${f};notas;"${String(d.notas).replace(/"/g,'""')}"`);
  }
  for(const [k,w] of Object.entries(S.work)){
    for(const [exId,e] of Object.entries(w.ex||{})){
      let exName=exId;
      for(const d of [1,2,3,4]) for(const x of DAYS[d].items) if(x.id===exId) exName=x.n;
      (e.series||[]).forEach((s,i)=>{ if(s&&(s.c||s.r||s.rir))
        lines.push(`entreno;${k};${exName} S${i+1};carga=${s.c||''} reps=${s.r||''} rir=${s.rir||''}`); });
      if(e.obj) lines.push(`entreno;${k};${exName};objetivo="${e.obj}"`);
      if(e.res) lines.push(`entreno;${k};${exName};resultado=${e.res}`);
      if(e.obs) lines.push(`entreno;${k};${exName};obs="${String(e.obs).replace(/"/g,'""')}"`);
    }
  }
  for(const [f,mm] of Object.entries(S.meals))
    for(const [id,m] of Object.entries(mm))
      lines.push(`comida;${f};${id};done=${m.done?1:0}${m.note?' "'+String(m.note).replace(/"/g,'""')+'"':''}`);
  download('luffyt-datos-'+todayStr()+'.csv', lines.join('\n'), 'text/csv');
  toast('CSV descargado');
}

/* Filas del día de hoy para pegar en el Excel personal (TSV, 1 fila por serie) */
function buildTodayRows(){
  const f=S.ui.fecha, d=S.days[f]||{}, c=d.cardio||{};
  const caf=d.caf?CAFES.reduce((a,x)=>a+(d.caf[x.id]||0)*x.mg,0)+(parseInt(d.caf.otros)||0):0;
  // datos del día (van solo en la 1ª fila)
  const dia=[f, fmtNum(d.peso), d.pasos||'', c.maquina||'Cinta', fmtNum(c.tiempo), fmtNum(c.vel), fmtNum(c.incl), c.kcal||'', caf||''];
  const filas=[];
  let first=true;
  const push=(micro, diaR, ejercicio, serie, carga, reps, rir, res, obs)=>{
    const daily = first ? dia : [f,'','','','','','','',''];
    filas.push([...daily, micro, diaR, ejercicio, serie, carga, reps, rir, res, obs].join('\t'));
    first=false;
  };
  // sesiones registradas hoy
  for(const [k,w] of Object.entries(S.work)){
    if(w.fecha!==f) continue;
    const mt=k.match(/m(\d+)-d(\d+)/); if(!mt) continue;
    const mi=mt[1], di=mt[2];
    for(const ex of DAYS[di].items){
      const e=w.ex[ex.id]; if(!e) continue;
      const ss=(e.series||[]);
      const resTxt=e.res==='llegue'?'llegué':e.res==='corto'?'me quedé corto':'';
      let any=false;
      ss.forEach((s,i)=>{ if(s&&(s.c||s.r||s.rir)){ any=true;
        push(mi, di, ex.n, 'S'+(i+1), fmtNum(s.c), s.r||'', s.rir||'', i===0?resTxt:'', i===0?(e.obs||''):'');
      }});
      if(!any && (e.res||e.obs)) push(mi, di, ex.n, '', '', '', '', resTxt, e.obs||'');
    }
  }
  // si no hubo entreno pero sí datos del día, al menos una fila con el resumen
  if(filas.length===0 && (d.peso||d.pasos||c.tiempo||c.kcal||caf))
    filas.push([...dia,'','','','','','','','',''].join('\t'));
  return filas.join('\n');
}

/* CSV solo del periodo elegido, en orden de Excel */
function exportRangeCSV(){
  const r=expRange();
  const L=['LUFFYT — '+r.lbl, ''];
  const sess=sessionsIn(r);
  if(sess.length){
    L.push('ENTRENOS'); L.push('fecha;microciclo;dia;ejercicio;serie;carga;reps;rir;resultado;observaciones');
    for(const s of sess) for(const ex of DAYS[s.d].items){
      const e=s.w.ex[ex.id]; if(!e) continue;
      (e.series||[]).forEach((x,i)=>{ if(x&&(x.c||x.r||x.rir))
        L.push([s.w.fecha||'',s.m,s.d,ex.n,'S'+(i+1),fmtNum(x.c),x.r||'',x.rir||'',
                e.res==='llegue'?'llegue':e.res==='corto'?'corto':'',
                (e.obs||'').replace(/;/g,',')].join(';')); });
    }
    L.push('');
  }
  const fs=daysIn(r);
  const conPeso=fs.filter(f=>S.days[f].peso!=null&&S.days[f].peso!=='');
  if(conPeso.length){
    L.push('PESO'); L.push('fecha;dia;kg');
    for(const f of conPeso) L.push([f,dowName(f),fmtNum(S.days[f].peso)].join(';'));
    const v=conPeso.map(f=>parseFloat(S.days[f].peso));
    L.push(';media;'+fmtNum((v.reduce((a,b)=>a+b,0)/v.length).toFixed(2))); L.push('');
  }
  let hayAct=false;
  for(const f of fs){
    const d=S.days[f], c=d.cardio||{};
    const caf=d.caf?CAFES.reduce((a,x)=>a+(d.caf[x.id]||0)*x.mg,0)+(parseInt(d.caf.otros)||0):0;
    if(d.pasos||c.tiempo||c.kcal||caf){
      if(!hayAct){ L.push('CARDIO, PASOS Y CAFEINA'); L.push('fecha;maquina;tiempo;velocidad;inclinacion;kcal;pasos;cafeina_mg'); hayAct=true; }
      L.push([f,c.maquina||'Cinta',fmtNum(c.tiempo),fmtNum(c.vel),fmtNum(c.incl),c.kcal||'',d.pasos||'',caf||''].join(';'));
    }
  }
  if(hayAct) L.push('');
  const mealDays=Object.keys(S.meals).filter(f=>f>=r.from&&f<=r.to).sort();
  let hayCom=false;
  for(const f of mealDays){
    const mm=S.meals[f];
    for(const x of allMeals()){
      const st=mm[x.id]; if(!st||(!st.done&&!st.note)) continue;
      if(!hayCom){ L.push('COMIDAS'); L.push('fecha;comida;cumplida;que_comi'); hayCom=true; }
      L.push([f, x.n.replace(/^[^\p{L}]+/u,''), st.done?'si':'no', (st.note||'').replace(/;/g,',')].join(';'));
    }
  }
  const slug=r.lbl.replace(/[^\wáéíóúñ]+/gi,'-').toLowerCase();
  download('luffyt-'+slug+'.csv', L.join('\n'), 'text/csv');
  toast('CSV descargado 📄');
}
